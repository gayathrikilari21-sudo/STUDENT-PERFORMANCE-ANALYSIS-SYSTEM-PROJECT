{% extends "base.html" %}
{% block title %}Change password · PerformIQ{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">Account</div><h1>Change password</h1>
  <p class="muted">Signed in as <b>{{ user.username }}</b> ({{ user.role }})</p></div></div>
<div class="card" style="max-width:480px">
  <form method="post" class="grid" style="gap:16px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
    <label>New password (min 6 characters) <input type="password" name="new" required minlength="6" autocomplete="new-password"></label>
    <label>Confirm new password <input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
